<html>
    <head>
        <link rel="stylesheet" href="index.css">

            </div>
            <div>
                <h1>Mc DOVIN SCHOOLS</h1>
                <div class="board" id="guest-board">0</div>
                <button onclick="add1g()" class="btn">+1</button>
                <button onclick="add2g()" class="btn">+2</button>
                <button onclick="add3g()" class="btn">+3</button>
            </div>  
        </div>
        <script src="index.js"></script>
    </body>
